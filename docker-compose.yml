version: "3.8"

volumes:
  postgres-data:
  rabbitmq-data:
  rabbitmq-logs:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  default:
    name: dndtrackernetwork
    external: false

services:
  # DNDTracker Application Services
  dndtracker.api:
    image: dndtracker.main
    build:
      context: .
      dockerfile: src/DNDTracker.Main/Dockerfile
    ports:
      - "5169:8080"
      - "8081:8081"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=dndtracker;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Scalar__Enabled=true
      - OpenTelemetry__ServiceName=DNDTracker
      - OpenTelemetry__ServiceVersion=1.0.0
      - OpenTelemetry__Endpoint=http://otel-collector:4317
    depends_on:
      init-dndtracker:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - default

  init-dndtracker:
    image: dndtracker.main
    build:
      context: .
      dockerfile: src/DNDTracker.Main/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=dndtracker;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - ASPNETCORE_ENVIRONMENT=Development
      - DNDTRACKER_INIT=true
      - OpenTelemetry__ServiceName=DNDTracker
      - OpenTelemetry__ServiceVersion=1.0.0
      - OpenTelemetry__Endpoint=http://otel-collector:4317
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: "no"
    networks:
      - default

  postgres:
    image: dndtracker.postgres
    build:
      context: ./postgres
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dndtracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=dndtracker"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - default

  postgres-init:
    image: postgres:16
    environment:
      PGPASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - psql
      - --host=postgres
      - --username=postgres
      - --dbname=dndtracker
      - --command=CREATE EXTENSION IF NOT EXISTS pg_stat_statements; CREATE EXTENSION IF NOT EXISTS pg_wait_sampling; CREATE EXTENSION IF NOT EXISTS pg_stat_monitor;
    restart: "no"
    networks:
      - default

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_LOGS=/var/log/rabbitmq/rabbitmq.log
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - default

  # Observability stack
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics scrape endpoint
    depends_on:
      - jaeger
      - loki
    networks:
      - default

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686" # Jaeger UI
      - "14317:4317"  # Jaeger OTLP gRPC (internal: 4317)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - default

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI
    networks:
      - default

  loki:
    image: grafana/loki:3.7.6
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"   # Loki API
    volumes:
      - loki-data:/loki
    networks:
      - default

  grafana:
    image: grafana/grafana:13.1.3
    ports:
      - "3000:3000"   # Grafana UI (admin/admin)
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - default
