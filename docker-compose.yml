version: "3.8"

volumes:
  postgres-data:
  rabbitmq-data:
  rabbitmq-logs:

networks:
  default:
    name: dndtrackernetwork
    external: false

services:
  # DNDTracker Application Services
  dndtracker.api:
    image: dndtracker.main
    build:
      context: .
      dockerfile: src/DNDTracker.Main/Dockerfile
    ports:
      - "5169:8080"
      - "8081:8081"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=dndtracker;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Scalar__Enabled=true
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:?NEW_RELIC_LICENSE_KEY non impostata nell'ambiente locale}
      - NEW_RELIC_APP_NAME=DndTracker
      - NEW_RELIC_REGION=eu
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=true
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    networks:
      - default

  postgres:
    image: dndtracker.postgres
    build:
      context: ./postgres
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dndtracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=dndtracker"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - default

  postgres-init:
    image: postgres:16
    environment:
      PGPASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - psql
      - --host=postgres
      - --username=postgres
      - --dbname=dndtracker
      - --command=CREATE EXTENSION IF NOT EXISTS pg_stat_statements; CREATE EXTENSION IF NOT EXISTS pg_wait_sampling; CREATE EXTENSION IF NOT EXISTS pg_stat_monitor;
    restart: "no"
    networks:
      - default

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_LOGS=/var/log/rabbitmq/rabbitmq.log
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    networks:
      - default

  newrelic-infra:
    image: dndtracker.newrelic-infra
    container_name: newrelic-infra
    build:
      context: ./newrelic-infra
      dockerfile: newrelic-infra.dockerfile
    environment:
      NRIA_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?NEW_RELIC_LICENSE_KEY non impostata}
      NRIA_ENDPOINT: https://infra-api.eu.newrelic.com
      NRIA_DISPLAY_NAME: dndtracker-docker
      NRIA_LOG_FORWARDING_ENABLED: "true"
      RABBITMQ_MANAGEMENT_HOST: host.docker.internal
      RABBITMQ_MANAGEMENT_PORT: "15672"
      RABBITMQ_MANAGEMENT_USERNAME: guest
      RABBITMQ_MANAGEMENT_PASSWORD: guest
      POSTGRES_MONITORING_HOST: host.docker.internal
      POSTGRES_MONITORING_PORT: "5432"
      POSTGRES_MONITORING_DATABASE: dndtracker
      POSTGRES_MONITORING_USERNAME: postgres
      POSTGRES_MONITORING_PASSWORD: postgres
    cap_add:
      - SYS_PTRACE
    network_mode: host
    privileged: true
    pid: host
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - rabbitmq-logs:/var/log/rabbitmq:ro
    depends_on:
      - rabbitmq
    restart: unless-stopped
